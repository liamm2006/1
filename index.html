<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberDealz Generator - Pro Edition</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 Stable CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            cyber: ['Rajdhani', 'sans-serif'],
          },
          colors: {
            cyber: {
              bg: '#050914',
              card: '#0d1321',
              border: '#1e293b',
              accent: '#06b6d4',
              tgBg: '#0f172a',
              tgBubble: '#1e293b'
            }
          }
        }
      }
    };
  </script>

  <style>
    body { background-color: #050914; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #050914; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
    .glass-panel { background: rgba(13, 19, 33, 0.7); backdrop-filter: blur(10px); border: 1px solid #1e293b; }
    .neon-glow { box-shadow: 0 0 20px rgba(6, 182, 212, 0.1); }
    
    /* Custom Date Picker Icon Styling for Dark Mode */
    ::-webkit-calendar-picker-indicator {
        filter: invert(1) hue-rotate(180deg) brightness(1.5);
        cursor: pointer;
    }
    
    .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-cyan-500 selection:text-black">

<!-- STREAMING_CHUNK:Initializing Application Container -->
<div id="app" class="flex flex-col min-h-screen">

  <!-- HEADER -->
  <header class="glass-panel sticky top-0 z-40 border-b border-cyber-border">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/20">
          <i class="fa-solid fa-bolt text-xl"></i>
        </div>
        <div>
          <h1 class="font-cyber text-2xl font-bold tracking-wider text-white uppercase leading-tight">CYBER<span class="text-cyan-400">DEALZ</span></h1>
          <div class="text-[10px] font-mono text-cyan-500 tracking-widest uppercase">Content Generator v6.0 Pro</div>
        </div>
      </div>
      <div class="flex space-x-3">
        <button @click="resetApp" class="px-4 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-xs font-semibold transition text-slate-200 flex items-center shadow-sm">
          <i class="fa-solid fa-rotate-left mr-2"></i> Alles zurücksetzen
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- LEFT COLUMN: Formular -->
      <div class="lg:col-span-7 space-y-6">
        
        <!-- STREAMING_CHUNK:Rendering Category Selection -->
        <div class="glass-panel rounded-2xl p-5 neon-glow">
          <div class="flex justify-between items-center mb-4">
            <h2 class="font-cyber text-lg font-bold text-white uppercase tracking-wider flex items-center">
              <i class="fa-solid fa-layer-group text-cyan-400 mr-2"></i> Deal Kategorie
            </h2>
            <span class="text-xs text-slate-400 font-mono bg-slate-800/50 px-2 py-1 rounded-md">{{ categories.length }} Kategorien</span>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
            <button v-for="cat in categories" :key="cat.id" @click="selectCategory(cat)"
              :class="['px-3 py-2.5 rounded-xl border text-sm font-medium transition flex items-center space-x-2 text-left', 
                       selectedCategory.id === cat.id ? 'bg-cyan-500/15 border-cyan-500 text-white shadow-[0_0_12px_rgba(6,182,212,0.25)] font-bold' : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:text-slate-200 hover:border-slate-600']">
              <span class="text-lg leading-none">{{ cat.icon }}</span>
              <span class="truncate">{{ cat.name }}</span>
            </button>
          </div>
        </div>

        <!-- STREAMING_CHUNK:Rendering Base Data Form -->
        <div class="glass-panel rounded-2xl p-6 relative">
          <h2 class="font-cyber text-lg font-bold text-white uppercase tracking-wider mb-5 flex items-center">
            <i class="fa-solid fa-box-open text-cyan-400 mr-2"></i> Basis Daten
          </h2>
          
          <div class="space-y-5">
            <!-- Titel -->
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1.5">Produktname <span class="text-rose-400">*</span></label>
              <input type="text" v-model="form.title" placeholder="z.B. Sony PlayStation 5 Slim / Samsung Galaxy S24 Ultra" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition shadow-inner">
            </div>

            <!-- Preise -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-900/40 p-4 rounded-xl border border-slate-800">
              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <label class="block text-xs font-semibold text-slate-400">Neuer Preis (€) <span class="text-rose-400">*</span></label>
                  <span v-if="discountInfo" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                    -{{ discountInfo.percent }}%
                  </span>
                </div>
                <input type="number" step="0.01" v-model.number="form.newPrice" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-base text-emerald-400 font-bold focus:border-emerald-500 outline-none transition">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Alter Preis / UVP (€)</label>
                <input type="number" step="0.01" v-model.number="form.oldPrice" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-base text-rose-400 focus:border-rose-500 outline-none transition line-through decoration-rose-500/50">
              </div>
            </div>

            <!-- Bewertungen -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Bewertung (Sterne)</label>
                <input type="number" step="0.1" min="0" max="5" v-model="form.ratingStars" placeholder="z.B. 4.7" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-amber-400 outline-none transition">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Anzahl Bewertungen</label>
                <input type="number" v-model="form.ratingCount" placeholder="z.B. 1850" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-amber-400 outline-none transition">
              </div>
            </div>

            <!-- STREAMING_CHUNK:Rendering Custom Selectors -->
            <!-- Händler Auswahl -->
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-2">Händler</label>
              <div class="flex flex-wrap gap-2">
                <button v-for="ret in optionsPool.retailers" :key="ret"
                  @click="form.retailer = (form.retailer === ret ? '' : ret)"
                  :class="['px-3 py-1.5 rounded-lg text-xs font-medium border transition duration-200', 
                           form.retailer === ret ? 'bg-cyan-500 text-black border-cyan-500 shadow-[0_0_8px_rgba(6,182,212,0.4)] font-bold' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 hover:border-slate-500']">
                  {{ ret }} <i v-if="form.retailer === ret" class="fa-solid fa-check ml-1 text-[10px]"></i>
                </button>
                
                <button v-if="!isAddingCustom('retailer')" @click="triggerCustomOption('retailer')" class="px-3 py-1.5 rounded-lg text-xs font-medium border border-dashed border-slate-600 text-slate-400 hover:text-cyan-400 hover:border-cyan-400 transition bg-slate-900/50">
                  <i class="fa-solid fa-plus mr-1"></i> Eigener
                </button>
                <div v-if="isAddingCustom('retailer')" class="flex items-center space-x-1">
                  <input type="text" v-model="customInput['retailer']" @keyup.enter="saveCustomOption('retailer', 'retailers', false)" placeholder="Name..." class="bg-slate-900 border border-cyan-500 rounded-lg px-2 py-1.5 text-xs text-white outline-none w-32 focus:ring-1 focus:ring-cyan-500">
                  <button @click="saveCustomOption('retailer', 'retailers', false)" class="p-1.5 text-emerald-400 hover:bg-emerald-400/10 rounded"><i class="fa-solid fa-check"></i></button>
                  <button @click="cancelCustomOption('retailer')" class="p-1.5 text-rose-400 hover:bg-rose-400/10 rounded"><i class="fa-solid fa-xmark"></i></button>
                </div>
              </div>
            </div>

            <!-- Versand Auswahl -->
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-2">Versand</label>
              <div class="flex flex-wrap gap-2">
                <button v-for="ship in optionsPool.shipping" :key="ship" 
                  @click="form.shipping = ship"
                  :class="['px-3 py-1.5 rounded-lg text-xs font-medium border transition duration-200', 
                           form.shipping === ship ? 'bg-cyan-500 text-black border-cyan-500 shadow-[0_0_8px_rgba(6,182,212,0.4)] font-bold' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 hover:border-slate-500']">
                  {{ ship }} <i v-if="form.shipping === ship" class="fa-solid fa-check ml-1 text-[10px]"></i>
                </button>

                <button v-if="!isAddingCustom('shipping')" @click="triggerCustomOption('shipping')" class="px-3 py-1.5 rounded-lg text-xs font-medium border border-dashed border-slate-600 text-slate-400 hover:text-cyan-400 hover:border-cyan-400 transition bg-slate-900/50">
                  <i class="fa-solid fa-plus mr-1"></i> Eigener
                </button>
                <div v-if="isAddingCustom('shipping')" class="flex items-center space-x-1">
                  <input type="text" v-model="customInput['shipping']" @keyup.enter="saveCustomOption('shipping', 'shipping', false)" placeholder="z.B. 2,99 €..." class="bg-slate-900 border border-cyan-500 rounded-lg px-2 py-1.5 text-xs text-white outline-none w-32 focus:ring-1 focus:ring-cyan-500">
                  <button @click="saveCustomOption('shipping', 'shipping', false)" class="p-1.5 text-emerald-400 hover:bg-emerald-400/10 rounded"><i class="fa-solid fa-check"></i></button>
                  <button @click="cancelCustomOption('shipping')" class="p-1.5 text-rose-400 hover:bg-rose-400/10 rounded"><i class="fa-solid fa-xmark"></i></button>
                </div>
              </div>
            </div>

            <!-- STREAMING_CHUNK:Rendering Date and Features (New QoL Improvements) -->
            <!-- GÜLTIGKEIT (NEU FÜR ALLE KATEGORIEN) -->
            <div class="bg-slate-800/30 p-4 rounded-xl border border-slate-700">
              <label class="block text-xs font-bold text-cyan-400 mb-2 uppercase tracking-wide">
                <i class="fa-regular fa-clock mr-1"></i> Gültig bis (Enddatum)
              </label>
              
              <div class="flex flex-wrap gap-2 mb-3">
                <button @click="form.validityType = 'date'" :class="form.validityType === 'date' ? 'bg-cyan-600 text-white border-cyan-500' : 'bg-slate-800 text-slate-300 border-slate-600'" class="px-3 py-1.5 rounded-lg text-xs font-medium border transition">
                  📅 Datum/Uhrzeit
                </button>
                <button @click="form.validityType = 'stock'" :class="form.validityType === 'stock' ? 'bg-cyan-600 text-white border-cyan-500' : 'bg-slate-800 text-slate-300 border-slate-600'" class="px-3 py-1.5 rounded-lg text-xs font-medium border transition">
                  📦 Solange Vorrat reicht
                </button>
                <button @click="form.validityType = 'today'" :class="form.validityType === 'today' ? 'bg-cyan-600 text-white border-cyan-500' : 'bg-slate-800 text-slate-300 border-slate-600'" class="px-3 py-1.5 rounded-lg text-xs font-medium border transition">
                  🌙 Nur heute
                </button>
                <button @click="form.validityType = 'none'" :class="form.validityType === 'none' ? 'bg-slate-600 text-white border-slate-500' : 'bg-slate-900 text-slate-500 border-slate-800'" class="px-3 py-1.5 rounded-lg text-xs font-medium border transition">
                  ❌ Keine Angabe
                </button>
              </div>

              <!-- Nativer Kalender -->
              <Transition name="fade">
                <div v-if="form.validityType === 'date'" class="mt-2">
                  <input type="datetime-local" v-model="form.validityDate" class="w-full max-w-sm bg-slate-900 border border-slate-600 rounded-xl px-4 py-2 text-sm text-white focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none shadow-inner">
                </div>
              </Transition>
            </div>

            <!-- HIGHLIGHTS / DEAL FEATURES (Automatisierte Texte) -->
            <div>
              <div class="flex justify-between items-end mb-2">
                <label class="block text-xs font-semibold text-slate-400">Highlights / Features <span class="text-[10px] text-cyan-400 font-normal ml-1">(Mehrfachauswahl - wird auto-übersetzt)</span></label>
              </div>
              <div class="flex flex-wrap gap-2">
                <button v-for="feat in optionsPool.dealFeatures" :key="feat"
                  @click="toggleFeature(feat)"
                  :class="['px-3 py-1.5 rounded-lg text-xs font-medium border transition duration-200', 
                           form.features.includes(feat) ? 'bg-blue-600/30 text-blue-300 border-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.3)]' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700']">
                  <i v-if="form.features.includes(feat)" class="fa-solid fa-check mr-1 text-[10px]"></i>{{ feat }}
                </button>
              </div>
            </div>

            <!-- Link & Hashtags -->
            <div class="grid grid-cols-1 gap-4 pt-2 border-t border-slate-800">
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Deal Link <span class="text-rose-400">*</span></label>
                <div class="relative">
                  <i class="fa-solid fa-link absolute left-3.5 top-3 text-slate-500"></i>
                  <input type="url" v-model="form.link" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-cyan-400 focus:border-cyan-500 outline-none transition">
                </div>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Hashtags</label>
                <input type="text" v-model="form.hashtags" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-blue-400/80 focus:border-cyan-500 outline-none transition">
              </div>
            </div>

          </div>
        </div>

        <!-- STREAMING_CHUNK:Rendering Dynamic Fields -->
        <div v-if="selectedCategory.dynamicFields && selectedCategory.dynamicFields.length > 0" class="glass-panel rounded-2xl p-6 border-cyan-900/40 neon-glow">
          <h2 class="font-cyber text-lg font-bold text-white uppercase tracking-wider mb-5 flex items-center">
            <i class="fa-solid fa-sliders text-cyan-400 mr-2"></i> {{ selectedCategory.name }} Details
          </h2>
          
          <div class="space-y-5">
            <div v-for="field in selectedCategory.dynamicFields" :key="field.id">
              
              <div v-if="field.type === 'text'">
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">{{ field.label }}</label>
                <input type="text" v-model="form.dynamic[field.id]" :placeholder="field.placeholder" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-cyan-500 outline-none">
              </div>

              <div v-if="field.type === 'options'">
                <div class="flex items-center justify-between mb-2">
                  <label class="block text-xs font-semibold text-slate-400">
                    {{ field.label }} 
                    <span v-if="field.multiSelect" class="text-[10px] text-cyan-400 font-normal ml-1">(Mehrfachauswahl)</span>
                  </label>
                </div>
                <div class="flex flex-wrap gap-2">
                  <button v-for="opt in getOptionsList(field.optionsKey)" :key="opt" 
                    @click="toggleOption(field.id, opt, field.multiSelect)"
                    :class="['px-3 py-1.5 rounded-lg text-xs font-medium border transition', 
                             isOptionSelected(field.id, opt, field.multiSelect) ? 'bg-cyan-500 text-black border-cyan-500 shadow-[0_0_8px_rgba(6,182,212,0.4)] font-bold' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700']">
                    {{ opt }} <i v-if="isOptionSelected(field.id, opt, field.multiSelect)" class="fa-solid fa-check ml-1 text-[10px]"></i>
                  </button>
                  
                  <button v-if="!isAddingCustom(field.id)" @click="triggerCustomOption(field.id)" class="px-3 py-1.5 rounded-lg text-xs font-medium border border-dashed border-slate-600 text-slate-400 hover:text-cyan-400 hover:border-cyan-400 transition bg-slate-900/50">
                    <i class="fa-solid fa-plus mr-1"></i> Eigener
                  </button>
                  
                  <div v-if="isAddingCustom(field.id)" class="flex items-center space-x-1">
                    <input type="text" v-model="customInput[field.id]" @keyup.enter="saveCustomOption(field.id, field.optionsKey, field.multiSelect)" placeholder="Wert..." class="bg-slate-900 border border-cyan-500 rounded-lg px-2 py-1.5 text-xs text-white outline-none w-32 focus:ring-1 focus:ring-cyan-500">
                    <button @click="saveCustomOption(field.id, field.optionsKey, field.multiSelect)" class="p-1.5 text-emerald-400 hover:bg-emerald-400/10 rounded"><i class="fa-solid fa-check"></i></button>
                    <button @click="cancelCustomOption(field.id)" class="p-1.5 text-rose-400 hover:bg-rose-400/10 rounded"><i class="fa-solid fa-xmark"></i></button>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>

        <!-- Manuelle Zusatzinfos (Fallback) -->
        <div class="glass-panel rounded-2xl p-6">
          <label class="block text-xs font-semibold text-slate-400 mb-2">Manuelle Zusatzinfo (Wird <span class="text-rose-400 font-bold">NICHT</span> automatisch übersetzt)</label>
          <textarea v-model="form.additionalInfo" rows="2" placeholder="Nur für spezielle Hinweise nutzen, die nicht durch Features abgedeckt sind..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-300 focus:border-cyan-500 outline-none transition resize-none"></textarea>
        </div>

      </div>

      <!-- STREAMING_CHUNK:Rendering Telegram Preview -->
      <!-- RIGHT COLUMN: Vorschau -->
      <div class="lg:col-span-5 space-y-6 lg:sticky lg:top-20">
        
        <div class="glass-panel rounded-2xl p-1 flex flex-col h-full border-cyan-900/30 shadow-2xl">
          
          <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/50 rounded-t-2xl">
            <h2 class="font-cyber text-lg font-bold text-white uppercase flex items-center">
              <i class="fa-brands fa-telegram text-[#2AABEE] mr-2 text-xl"></i> Telegram Preview
            </h2>
            <label class="flex items-center space-x-2 cursor-pointer text-xs text-slate-400 hover:text-white transition group">
              <input type="checkbox" v-model="rawEditMode" @change="syncEditMode" class="form-checkbox bg-slate-900 border-slate-700 rounded text-cyan-500 cursor-pointer">
              <span class="group-hover:text-cyan-400">Code Editor Modus</span>
            </label>
          </div>

          <!-- Telegram Chat Bubble Layout -->
          <div class="bg-cyber-tgBg flex-1 p-4 overflow-y-auto" style="min-height: 500px; max-height: 700px; background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 20px 20px;">
            
            <div v-if="!rawEditMode" class="w-full max-w-[95%] bg-cyber-tgBubble rounded-2xl rounded-bl-sm p-4 shadow-md border border-slate-700/50 relative">
              <!-- Decorative Telegram Tail -->
              <svg viewBox="0 0 11 20" class="absolute -left-[10px] bottom-0 w-[11px] h-[20px] text-cyber-tgBubble fill-current drop-shadow-sm">
                <path d="M11 0C11 0 11 20 11 20C11 20 0 20 0 20C5 20 11 0 11 0Z"/>
              </svg>
              
              <div class="whitespace-pre-wrap font-sans text-[13px] sm:text-sm text-slate-100 leading-[1.6] break-words">{{ generatedPost }}</div>
              
              <div class="text-right text-[10px] text-slate-400 mt-2 select-none flex justify-end items-center space-x-1">
                <span>{{ currentTime }}</span>
                <i class="fa-solid fa-check-double text-cyan-500"></i>
              </div>
            </div>

            <!-- RAW Textarea -->
            <textarea v-else v-model="editablePost" class="w-full h-full min-h-[500px] bg-slate-900/80 border border-slate-700 rounded-xl p-4 text-slate-200 resize-none outline-none whitespace-pre-wrap font-mono text-xs focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition shadow-inner"></textarea>
          </div>

          <!-- Actions -->
          <div class="p-4 bg-slate-900/50 rounded-b-2xl border-t border-slate-800">
            <button @click="copyToClipboard" :disabled="!canGenerate" :class="!canGenerate ? 'opacity-50 cursor-not-allowed grayscale' : 'hover:from-cyan-400 hover:to-blue-500 active:scale-[0.98]'" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold text-sm uppercase rounded-xl transition-all duration-200 flex justify-center items-center space-x-2 shadow-[0_0_15px_rgba(6,182,212,0.3)]">
              <i class="fa-regular fa-copy text-lg"></i><span>Kopieren & Posten</span>
            </button>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- STREAMING_CHUNK:Rendering Toast Component -->
  <!-- Toast Message -->
  <Transition name="fade">
    <div v-if="toast.show" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-emerald-500/90 backdrop-blur-md border border-emerald-400 text-white px-6 py-3 rounded-full shadow-2xl shadow-emerald-500/20 text-sm font-bold flex items-center space-x-3">

      if(dyn.categoryName) { extraDe += `📁 Sparte:\n${formatVal(dyn.categoryName)}\n\n`; extraEn += `📁 Subcategory:\n${translateVal(dyn.categoryName)}\n\n`; }

      const headerTitleDE = (cat && cat.headerDE ? cat.headerDE : '🔥 DEAL ALERT | ANGEBOT').toUpperCase();
      const headerTitleEN = (cat && cat.headerEN ? cat.headerEN : '🔥 DEAL ALERT | OFFER').toUpperCase();

      // --- DEUTSCH ---
      let post = `${headerTitleDE}\n\n🇩🇪 Deutsch\n\n`;
      post += `🛒 Produkt:\n${d.title}\n\n`;
      if(d.retailer) post += `🏪 Händler:\n${d.retailer}\n\n`;
      post += `🏷️ Kategorie:\n${cat.name}\n\n`;
      
      if(extraDe) post += extraDe;
      
      post += `💰 Preis:\n${priceStr}\n`;
      if(oldStr) post += `\n❌ Statt:\n${oldStr}\n`;
      if(disc) post += `\n📉 Ersparnis:\n${disc.percent} % Rabatt / ${disc.saved} € gespart\n`;
      
      post += ratingStrDE;
      
      if(validityDE) post += `\n⏳ Gültig bis:\n${validityDE}\n`;
      
      post += `\n🚚 Versand:\n${d.shipping}\n`;
      
      post += featuresDE;
      
      post += `\n🔗 Zum Angebot:\n${d.link || '[Link hier einfügen]'}\n`;
      if(d.additionalInfo) post += `\n📌 Info:\n${d.additionalInfo}\n`;

      post += `\n━━━━━━━━━━━━━━\n\n`;

      // --- ENGLISH ---
      post += `🇬🇧 English\n\n${headerTitleEN}\n\n`;
      post += `🛒 Product:\n${d.title}\n\n`;
      if(d.retailer) post += `🏪 Retailer:\n${d.retailer}\n\n`;
      post += `🏷️ Category:\n${translate(cat.name)}\n\n`;
      
      if(extraEn) post += extraEn;
      
      post += `💰 Price:\n${formatPrice(d.newPrice).replace(',', '.')}\n`;
      if(oldStr) post += `\n❌ Was:\n${formatPrice(d.oldPrice).replace(',', '.')}\n`;
      if(disc) post += `\n📉 Discount:\n${disc.percent}% OFF / Save ${disc.saved.replace(',', '.')} €\n`;
      
      post += ratingStrEN;
      
      if(validityEN) post += `\n⏳ Valid until:\n${validityEN}\n`;
      
      post += `\n🚚 Shipping:\n${translate(d.shipping)}\n`;
      
      post += featuresEN;
      
      post += `\n🔗 Deal link:\n${d.link || '[Insert link here]'}\n`;
      if(d.additionalInfo) post += `\n📌 Info:\n${d.additionalInfo}\n`;

      // HASHTAGS
      if(d.hashtags) post += `\n${d.hashtags}`;

      return post;
    });

    const syncEditMode = () => {
      if(rawEditMode.value) {
        editablePost.value = generatedPost.value;
      }
    };

    const copyToClipboard = () => {
      if(!canGenerate.value) return;
      const text = rawEditMode.value ? editablePost.value : generatedPost.value;
      
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        toast.value.message = 'Erfolgreich kopiert! Bereit für Telegram.';
        toast.value.show = true;
        setTimeout(() => toast.value.show = false, 3000);
      } catch (err) {
        console.error('Kopieren fehlgeschlagen', err);
      }
      document.body.removeChild(textarea);
    };

    const resetApp = () => {
      form.title = ''; form.newPrice = null; form.oldPrice = null; 
      form.ratingStars = ''; form.ratingCount = ''; form.link = ''; 
      form.retailer = ''; form.additionalInfo = ''; 
      form.validityType = 'none'; form.validityDate = ''; form.features = [];
      form.dynamic = {};
      rawEditMode.value = false;
    };

    return {
      categories, selectedCategory, selectCategory,
      form, generatedPost, discountInfo, canGenerate,
      rawEditMode, editablePost, syncEditMode,
      copyToClipboard, resetApp, toast, optionsPool, currentTime,
      
      // Smart Options System
      getOptionsList, toggleOption, toggleFeature, isOptionSelected, triggerCustomOption,
      isAddingCustom, customInput, saveCustomOption, cancelCustomOption
    };
  }
}).mount('#app');
